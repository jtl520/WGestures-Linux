name: Publish Linux and Windows release

run-name: Publish ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v2.1.8

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore and build Windows application
        shell: pwsh
        run: |
          nuget restore WGestures.sln -PackagesDirectory packages `
            -ConfigFile NuGet.Config -NonInteractive
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net48 `
            -Version 1.0.3 -OutputDirectory packages `
            -ConfigFile NuGet.Config -NonInteractive
          $framework = Resolve-Path `
            'packages\Microsoft.NETFramework.ReferenceAssemblies.net48.1.0.3\build\.NETFramework\v4.8'
          msbuild WGestures.sln /t:Rebuild /m /v:minimal `
            '/p:Configuration=Release' '/p:Platform=Any CPU' `
            "/p:FrameworkPathOverride=$framework"
          ./tools/Test-WindowsBuild.ps1

      - name: Optionally sign Windows application
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            Write-Host 'No signing certificate configured; publishing an unsigned build.'
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'wgestures-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem `
            'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 `
            /tr http://timestamp.digicert.com /f $certificate `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            'WGestures.App\bin\Release\CrossGestures.exe'

      - name: Build and optionally sign EXE installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          nuget install Tools.InnoSetup -Version 6.4.3 `
            -OutputDirectory build\tools -ConfigFile NuGet.Config -NonInteractive
          & '.\build\tools\Tools.InnoSetup.6.4.3\tools\ISCC.exe' `
            '.\packaging\windows\CrossGestures.iss'
          $installer = Get-ChildItem build\windows\CrossGestures-*-Windows-Setup.exe |
            Select-Object -First 1
          ./tools/Test-WindowsBuild.ps1 -InstallerPath $installer.FullName
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certificate = Join-Path $env:RUNNER_TEMP 'wgestures-signing.pfx'
            $signtool = Get-ChildItem `
              'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1
            & $signtool.FullName sign /fd SHA256 /td SHA256 `
              /tr http://timestamp.digicert.com /f $certificate `
              /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
          }

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/CrossGestures-*-Windows-Setup.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper libglib2.0-bin lintian nodejs npm \
            python3 python3-cairo python3-gi python3-gi-cairo python3-xlib \
            gir1.2-gtk-3.0 zip

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: build/windows

      - name: Run checks and tests
        run: |
          make -f Makefile.ubuntu check
          make -f Makefile.ubuntu test

      - name: Build and inspect Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          package="$(find .. -maxdepth 1 -name 'wgestures_*_all.deb' -print -quit)"
          test -n "$package"
          lintian "$package"
          sha256sum "$package"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package="$(find .. -maxdepth 1 -name 'wgestures_*_all.deb' -print -quit)"
          package_name="$(basename "$package")"
          sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          windows_package="$(find build/windows -name 'CrossGestures-*-Windows-Setup.exe' -print -quit)"
          windows_name="$(basename "$windows_package")"
          windows_sha256="$(sha256sum "$windows_package" | cut -d ' ' -f 1)"
          notes="$(printf '%s\n\n%s\n%s\n%s\n\n%s\n%s\n\n%s\n%s\n\n%s\n%s\n\n%s' \
            'CrossGestures v2.1.8 跨平台快捷面板与手势可靠性更新。' \
            '- Windows、Ubuntu GNOME 和 Debian/X11 新增中键 4×4 快捷面板，支持软件、文件、文件夹、网址、图标、拖放和托盘备用入口' \
            '- 优化连续中键唤出的响应与稳定性；固定格子等宽等高，长名称自动省略且不再撑开面板' \
            '- 修复窗口置顶手势、Linux 快速 Enter/置顶误识别、相对路径程序启动、图标解析和文件夹误开 Catfish' \
            "Linux 安装：\`sudo apt install ./$package_name\`" \
            'Linux 首次运行：`wgestures --diagnose`，然后执行 `wgestures --enable`；卸载：`wgestures --disable && sudo apt purge wgestures`。' \
            "Windows 安装：运行 \`$windows_name\` 并同意一次 UAC（需要 .NET Framework 4.8）；卸载：运行 \`%ProgramFiles%\\CrossGestures\\unins000.exe\`。" \
            'Windows 安装到 Program Files，并使用最高权限登录任务覆盖 Codex 和管理员终端；升级会保留用户手势配置。' \
            "Linux SHA-256: \`$sha256\`" \
            "Windows SHA-256: \`$windows_sha256\`" \
            '验证：Linux Python/JavaScript 测试与 Debian 打包检查通过；Windows Debug/Release 构建、安装包检查、短按右键回放及 1000 次移动队列合并验证通过。')"
          gh release create "$RELEASE_TAG" "$package" "$windows_package" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "CrossGestures $RELEASE_TAG" \
            --notes "$notes"
