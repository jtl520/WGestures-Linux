name: Publish Linux release

run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        default: v2.1.2ubuntu6

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper libglib2.0-bin lintian nodejs npm \
            python3 python3-cairo python3-gi python3-gi-cairo python3-xlib \
            gir1.2-gtk-3.0 zip

      - name: Run checks and tests
        run: |
          make -f Makefile.ubuntu check
          make -f Makefile.ubuntu test

      - name: Build and inspect Debian package
        run: |
          dpkg-buildpackage -b -us -uc
          package="$(find .. -maxdepth 1 -name 'wgestures_*_all.deb' -print -quit)"
          test -n "$package"
          lintian "$package"
          sha256sum "$package"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package="$(find .. -maxdepth 1 -name 'wgestures_*_all.deb' -print -quit)"
          package_name="$(basename "$package")"
          sha256="$(sha256sum "$package" | cut -d ' ' -f 1)"
          notes="$(printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n\n%s\n\n%s' \
            'Ubuntu 24.04/X11 稳定性与界面修复版本。' \
            '- 修复启用手势后桌面、文件管理器和 Chromium/Typora 右键菜单失效' \
            '- 补齐 python3-gi-cairo 依赖，恢复轨迹和动作名称绘制' \
            '- 修复托盘中再次打开设置窗口无响应' \
            '- 修复 GTK 开关被横向拉伸及表单对齐问题' \
            "安装：\`sudo apt install ./$package_name\`" \
            '首次运行：`wgestures --diagnose`，然后执行 `wgestures --enable`。' \
            "SHA-256: \`$sha256\`" \
            'Ubuntu 24.04 X11 真实鼠标回放验证及 Xvfb/Openbox 完整验收通过；Wayland 后端行为未变。')"
          gh release create "$RELEASE_TAG" "$package" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "WGestures Linux $RELEASE_TAG" \
            --notes "$notes"
